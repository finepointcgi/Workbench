# The Workbench user and administrator guide, published to GitHub Pages by .github/workflows/docs.yml.
# Preview locally:  pip install -r docs/requirements.txt && mkdocs serve
# Screenshots come from tools/docs-screenshots (see its README).
site_name: Workbench Guide
site_description: User and administrator guide for Workbench, the project ERP and work-management system for government contractors.
site_url: https://finepointcgi.github.io/Workbench/guide/
repo_url: https://github.com/finepointcgi/Workbench
repo_name: finepointcgi/Workbench
edit_uri: edit/master/docs/
docs_dir: docs
site_dir: build/guide
copyright: Workbench

theme:
  name: material
  language: en
  logo: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - toc.follow

extra_css:
  - assets/guide.css

plugins:
  - search
  - glightbox:
      zoomable: true
      draggable: false
      skip_classes:
        - no-lightbox

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Developer notes and internal ISMS records stay in the repository but aren't published.
exclude_docs: |
  CONVENTIONS.md
  ux/
  iso/
  feature-coverage.md
  integrations/unanet-api-sync-design.md
  security/threat-model.md
  compliance/nist-800-171/gaps.md
  requirements.txt
  .DS_Store

not_in_nav: |
  /training/agenda-*.md
  /training/exercise-script.md
  /training/lifecycle-demo.md

validation:
  links:
    not_found: info
    absolute_links: info
    unrecognized_links: info
    anchors: info

