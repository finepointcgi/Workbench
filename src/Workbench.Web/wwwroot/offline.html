<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#B33C0B" />
    <title>Offline · Workbench</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f6f8; color: #1d2330; }
        header { background: #B33C0B; color: #fff; padding: 14px 16px; font-size: 1.15rem; font-weight: 600; }
        main { padding: 24px 16px; max-width: 480px; margin: 0 auto; }
        h1 { font-size: 1.4rem; margin: 0 0 12px; }
        p { line-height: 1.5; }
        a.button { display: inline-block; margin-top: 12px; padding: 14px 22px; border-radius: 8px; background: #B33C0B; color: #fff; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <header>Workbench</header>
    <main>
        <h1>You're offline</h1>
        <p>Workbench needs a connection to load your timesheet, expenses and approvals. Nothing is stored on this device.</p>
        <p>Hours and expenses you saved before you lost the connection are safe on the server. Anything you hadn't saved yet needs to be entered again.</p>
        <a class="button" href="m">Try again</a>
    </main>
</body>
</html>
