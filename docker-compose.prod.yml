# Production-shaped Workbench on one host: PostgreSQL 17, a one-shot migration job, the web host and Caddy as the
# TLS-terminating reverse proxy. An example to adapt (or translate to Kubernetes / ECS / Container Apps); see
# docs/operations/deployment.md.
#
#   scripts/prod/init-secrets.sh                      # creates ./secrets (git-ignored); edit the OIDC values in it
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml --profile backup run --rm backup     # nightly, from cron/systemd
#
# Upgrades: build or pull the new image, then `up -d`: the migrate job runs to completion before the web host starts.
name: workbench

x-workbench: &workbench
  image: ${WORKBENCH_IMAGE:-workbench:local}
  build:
    context: .
    target: runtime # the production stage; the Dockerfile's last stage is the demo
    args:
      VERSION: ${WORKBENCH_VERSION:-0.0.0}
  environment: &workbench-env
    ASPNETCORE_ENVIRONMENT: Production
    Database__Provider: PostgreSQL
    Database__MigrateOnStartup: "false"
    Security__TlsTerminatedByProxy: "true"
    # Caddy's address on the internal network (see networks below); forwarded headers from anyone else are ignored.
    ForwardedHeaders__KnownProxies__0: 172.28.0.10
    Notifications__PublicBaseUrl: https://${WORKBENCH_DOMAIN:-localhost}
    # Optional: leave empty to sign in with the built-in email-and-password accounts (scripts/install.sh does).
    Authentication__Oidc__Authority: ${OIDC_AUTHORITY:-}
    Authentication__Oidc__ClientId: ${OIDC_CLIENT_ID:-workbench}
    Authentication__Admins__0: ${WORKBENCH_BOOTSTRAP_ADMIN:-}
    DataProtection__Store: Database
    DataProtection__KeyEncryption: Certificate
    DataProtection__CertificatePath: /run/secrets/dataprotection.pfx
    Email__Mode: ${EMAIL_MODE:-Pickup}
    Email__From: ${EMAIL_FROM:-workbench@localhost}
    Email__Smtp__Host: ${SMTP_HOST:-}
    Email__Smtp__Port: ${SMTP_PORT:-587}
    OpenTelemetry__Endpoint: ${OTEL_ENDPOINT:-}
    Logging__Console__FormatterName: workbench-json
  # Secrets arrive as files in /run/secrets; the file name is the configuration key (ConnectionStrings__Workbench).
  secrets:
    - ConnectionStrings__Workbench
    - Scim__BearerToken
    - Authentication__Oidc__ClientSecret
    - DataProtection__CertificatePassword
    - source: dataprotection_pfx
      target: dataprotection.pfx
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [internal]

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: workbench
      POSTGRES_DB: workbench
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      # Checksums catch silent storage corruption; WAL archiving for point-in-time recovery: docs/operations/backup-restore.md.
      POSTGRES_INITDB_ARGS: --data-checksums
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbench -d workbench"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  migrate:
    <<: *workbench
    command: ["--migrate"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *workbench
    restart: unless-stopped
    volumes:
      - blobs:/data/blobs
      - mail:/data/mail
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "dotnet", "/app/Workbench.Web.dll", "--health-check"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  proxy:
    image: caddy:2.10
    restart: unless-stopped
    environment:
      WORKBENCH_DOMAIN: ${WORKBENCH_DOMAIN:-localhost}
      # "internal" issues a local CA certificate (testing); an email address gets a public ACME certificate.
      WORKBENCH_TLS: ${WORKBENCH_TLS:-internal}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      internal:
        ipv4_address: 172.28.0.10

  # On demand: `--profile backup run --rm backup`. Encrypted pg_dump of the database (or the catalog and every
  # tenant) with retention; see scripts/backup-all.sh.
  backup:
    profiles: [backup]
    build: deploy/backup
    image: workbench-backup:local
    environment:
      PGHOST: postgres
      PGUSER: workbench
      PGPASSFILE: /run/secrets/pgpass
      BACKUP_DIR: /backups
      BACKUP_DATABASES: ${BACKUP_DATABASES:-workbench}
      BACKUP_GPG_RECIPIENT_FILE: /run/secrets/backup_public_key.asc
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-35}
    # pgpass must be mode 0600 on the host (libpq ignores it otherwise); init-secrets.sh creates it so.
    secrets:
      - pgpass
      - backup_public_key.asc
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    command: ["/scripts/backup-all.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres-data:
  blobs:
  mail:
  caddy-data:
  caddy-config:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  pgpass:
    file: ./secrets/pgpass
  ConnectionStrings__Workbench:
    file: ./secrets/ConnectionStrings__Workbench
  Scim__BearerToken:
    file: ./secrets/Scim__BearerToken
  Authentication__Oidc__ClientSecret:
    file: ./secrets/Authentication__Oidc__ClientSecret
  DataProtection__CertificatePassword:
    file: ./secrets/DataProtection__CertificatePassword
  dataprotection_pfx:
    file: ./secrets/dataprotection.pfx
  backup_public_key.asc:
    file: ./secrets/backup_public_key.asc
