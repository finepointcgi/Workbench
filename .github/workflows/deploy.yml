# Release pipeline template: build and push the image once, deploy it to staging, then to production after an
# approval. ISO 27001 A.8.32 (change management), A.8.31 (separate environments).
#
# Set up once in GitHub (Settings → Environments):
#   staging     variables WORKBENCH_URL, DEPLOY_TARGET (+ target settings below); secrets for the target
#   production  the same, plus "Required reviewers" (the approval) and "Deployment branches: main and tags v*"
# The cloud provider isn't chosen yet, so deploy/deploy.sh is the only provider-specific part: it supports
# DEPLOY_TARGET=compose-ssh (one Docker host running docker-compose.prod.yml) and kubernetes, and is the place to add
# Azure Container Apps or ECS. Every deploy runs the migrate job before rolling out the new web host.
name: Deploy

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and deploy
        required: true
        default: master

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/workbench

jobs:
  build:
    name: Build, scan and push the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # build provenance attestation
      attestations: write
    outputs:
      image: ${{ steps.out.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (not pushed until scanned)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime # the production stage; the Dockerfile's last stage is the demo
          load: true
          tags: workbench:candidate
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.version.outputs.version || '0.0.0' }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (pinned by commit; the old 0.28.0 tag no longer resolves)
        with:
          image-ref: workbench:candidate
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push (immutable tag = commit SHA)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime # the production stage; the Dockerfile's last stage is the demo
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:{1}', env.IMAGE, steps.version.outputs.version) || '' }}
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && steps.version.outputs.version || '0.0.0' }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - id: out
        # Deploy by digest, so staging and production run exactly the bytes that were scanned.
        run: echo "image=${{ env.IMAGE }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

  staging:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.WORKBENCH_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Migrate, then roll out
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          KUBE_NAMESPACE: ${{ vars.KUBE_NAMESPACE }}
        run: deploy/deploy.sh
      - name: Smoke test
        run: deploy/smoke-test.sh "${{ vars.WORKBENCH_URL }}"

  production:
    name: Deploy to production
    needs: [build, staging]
    runs-on: ubuntu-latest
    environment:
      name: production   # Required reviewers on this environment are the approval gate.
      url: ${{ vars.WORKBENCH_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Migrate, then roll out
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
          DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          KUBE_NAMESPACE: ${{ vars.KUBE_NAMESPACE }}
        run: deploy/deploy.sh
      - name: Smoke test
        run: deploy/smoke-test.sh "${{ vars.WORKBENCH_URL }}"
