# Build, test and supply-chain checks (ISO 27001 A.8.25–A.8.29, A.8.8). Every pull request and every push to master/main
# must pass before merge; make the three "build-test" legs, "supply-chain" and "container" required checks in the
# branch protection rules. Deployment is .github/workflows/deploy.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  GITLEAKS_VERSION: "8.24.2"

jobs:
  build-test:
    # The whole suite runs three times: on EF Core InMemory (the local default), SQLite and a PostgreSQL 17 service
    # container (WORKBENCH_TEST_DB). The PostgreSQL-only tests ([PostgresFact]) run in every leg because the service is
    # always there.
    name: Build and test (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        database: [InMemory, Sqlite, PostgreSql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: workbench
          POSTGRES_PASSWORD: workbench
          POSTGRES_DB: workbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workbench -d workbench"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      WORKBENCH_TEST_DB: ${{ matrix.database }}
      WORKBENCH_TEST_POSTGRES: "Host=localhost;Port=5432;Username=workbench;Password=workbench"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: |
          dotnet restore Workbench.Server.slnf
          dotnet tool restore
      - name: Build
        # The MAUI desktop app is excluded: it needs Xcode or Windows.
        run: dotnet build Workbench.Server.slnf --no-restore --configuration Release
      - name: Migrations match the model (both providers, both contexts)
        if: matrix.database == 'Sqlite'
        run: |
          for provider in PostgreSql Sqlite; do
            for context in WorkbenchDbContext CatalogDbContext; do
              dotnet tool run dotnet-ef migrations has-pending-model-changes --no-build --configuration Release \
                --project "src/Workbench.Migrations.$provider" --startup-project "src/Workbench.Migrations.$provider" --context "$context"
            done
          done
      - name: Test
        run: dotnet test Workbench.Server.slnf --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.database }}
          path: test-results
          retention-days: 30

  supply-chain:
    name: Vulnerabilities, secrets and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore Workbench.Server.slnf

      - name: Vulnerable packages (fail on High or Critical)
        run: |
          dotnet list Workbench.Server.slnf package --vulnerable --include-transitive --format json > vulnerable.json
          jq -r '.projects[]?.frameworks[]? | (.topLevelPackages // []) + (.transitivePackages // []) | .[]
                 | select(.vulnerabilities != null) | .id as $id | .resolvedVersion as $v
                 | .vulnerabilities[] | "\(.severity)\t\($id) \($v)\t\(.advisoryurl)"' vulnerable.json | sort -u | tee vulnerable.txt
          if grep -E '^(High|Critical)' vulnerable.txt; then
            echo "::error::High or critical vulnerabilities in NuGet dependencies. Update the packages above."
            exit 1
          fi

      - name: Secret scanning (gitleaks)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

      - name: SBOM (CycloneDX)
        run: |
          dotnet tool install --global CycloneDX
          dotnet-CycloneDX Workbench.Server.slnf --exclude-test-projects --output sbom --filename workbench.cdx.json --output-format Json \
            --set-name Workbench --set-version "0.0.0-${GITHUB_SHA::7}"
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom/workbench.cdx.json
          retention-days: 90

  container:
    # The production image: build it, run the docker-compose.prod.yml stack (PostgreSQL, the migrate job, the web host,
    # Caddy) and check readiness through TLS, run the backup and restore test against it, then scan the image and
    # publish its SBOM. Nothing is pushed here.
    name: Container build, smoke test, scan and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime # the production stage; the Dockerfile's last stage is the demo
          load: true
          tags: workbench:ci
          build-args: |
            VERSION=0.0.0-ci
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the production stack
        env:
          WORKBENCH_IMAGE: workbench:ci
          OIDC_AUTHORITY: https://login.example.test/ci/v2.0
          HTTP_PORT: "8080"
          HTTPS_PORT: "8443"
        run: |
          scripts/prod/init-secrets.sh
          docker compose -f docker-compose.prod.yml up -d --no-build --wait --wait-timeout 180
          ready="$(curl -sk --fail https://localhost:8443/health/ready)"
          echo "$ready"
          echo "$ready" | jq -e '.checks.database == "Healthy" and .checks.catalog == "Healthy"'
          # Keys are stored encrypted with the configured certificate.
          docker compose -f docker-compose.prod.yml exec -T postgres psql -U workbench -d workbench -Atc \
            "SELECT count(*) > 0 AND bool_and(\"Xml\" LIKE '%encryptedSecret%') FROM \"DataProtectionKeys\"" | grep -qx t
      - name: Backup and restore test
        env:
          OIDC_AUTHORITY: https://login.example.test/ci/v2.0
        run: PGPASSWORD="$(cat secrets/postgres_password)" scripts/test-backup-restore.sh "$(docker compose -f docker-compose.prod.yml ps -q postgres)"
      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color
      - name: Scan the image (fail on fixable High or Critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (pinned by commit; the old 0.28.0 tag no longer resolves)
        with:
          image-ref: workbench:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Image SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: workbench:ci
          format: cyclonedx-json
          output-file: workbench-image.cdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-image-cyclonedx
          path: workbench-image.cdx.json
          retention-days: 90
