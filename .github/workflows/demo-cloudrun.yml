# Redeploys the public demo to Google Cloud Run on every push to master, and on demand. Builds the Dockerfile's "demo"
# stage, pushes it to Artifact Registry and points the existing Cloud Run service at the new image. Only the image is
# changed: the service's environment, scaling and settings stay as they are. Does nothing until it's set up
# (docs/demo-hosting.md, "Cloud Run"): Settings → Secrets and variables → Actions → Variables:
#   GCP_PROJECT_ID, GCP_REGION, CLOUD_RUN_SERVICE, GCP_AR_REPOSITORY (an Artifact Registry Docker repository),
#   GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_DEPLOY_SERVICE_ACCOUNT. No keys are stored: GitHub proves who it is to Google.
name: Demo (Cloud Run)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: demo-cloudrun
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy the demo to Cloud Run
    if: vars.CLOUD_RUN_SERVICE != ''
    runs-on: ubuntu-latest
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPOSITORY }}/workbench-demo
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build and push the demo image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: demo
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy (image only; the service's other settings stay)
        run: >
          gcloud run deploy "$SERVICE" --project "$PROJECT" --region "$REGION"
          --image "$IMAGE:${{ github.sha }}" --quiet
      - name: Smoke test
        run: |
          url="$(gcloud run services describe "$SERVICE" --project "$PROJECT" --region "$REGION" --format='value(status.url)')"
          for _ in $(seq 1 40); do
            if curl -fsS "$url/account/dev-signin" | grep -q "Workbench demo"; then
              echo "The demo is up: $url"
              exit 0
            fi
            sleep 6
          done
          echo "The demo sign-in page didn't come up at $url." >&2
          exit 1
