# A PostgreSQL 17 just for load testing (port 5444), sized like a small self-hosted server and with pg_stat_statements
# for per-query database time. Docker's default 64 MB /dev/shm is too small for parallel queries on the load data.
#   docker compose -f tests/load/docker-compose.yml up -d
services:
  postgres:
    image: postgres:17
    container_name: workbench-loadtest-pg
    shm_size: 1g
    environment:
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: workbench
      POSTGRES_DB: workbench
    ports:
      - "5444:5432"
    command:
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_connections=300
      - -c
      - random_page_cost=1.1
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
