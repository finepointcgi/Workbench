<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 560" role="img" aria-labelledby="t d">
  <title id="t">Timesheet on a phone</title>
  <desc id="d">Illustration of a weekly timesheet on a phone with hours charged to two projects and a submit button.</desc>
  <rect x="8" y="8" width="304" height="544" rx="38" fill="#1c2420"/>
  <rect x="20" y="20" width="280" height="520" rx="28" fill="#fbfaf7"/>
  <rect x="120" y="28" width="80" height="8" rx="4" fill="#1c2420"/>
  <g font-family="system-ui,sans-serif" fill="#1c2420">
    <text x="40" y="76" font-size="20" font-weight="700">My timesheet</text>
    <text x="40" y="98" font-size="13" fill="#5b665f">Week of 26 Oct</text>
    <g font-size="12" fill="#5b665f" text-anchor="middle">
      <text x="62" y="136">Mon</text><text x="100" y="136">Tue</text><text x="138" y="136">Wed</text><text x="176" y="136">Thu</text><text x="214" y="136">Fri</text>
    </g>
    <rect x="40" y="152" width="240" height="96" rx="12" fill="#fff" stroke="#e3e1d9"/>
    <text x="54" y="178" font-size="14" font-weight="600">Task order 0042</text>
    <text x="54" y="196" font-size="12" fill="#5b665f">Engineering</text>
    <g font-size="14" text-anchor="middle"><text x="62" y="228">8</text><text x="100" y="228">8</text><text x="138" y="228">6</text><text x="176" y="228">8</text><text x="214" y="228">4</text></g>
    <rect x="40" y="260" width="240" height="96" rx="12" fill="#fff" stroke="#e3e1d9"/>
    <text x="54" y="286" font-size="14" font-weight="600">Proposal support</text>
    <text x="54" y="304" font-size="12" fill="#5b665f">Business development</text>
    <g font-size="14" text-anchor="middle"><text x="62" y="336">0</text><text x="100" y="336">0</text><text x="138" y="336">2</text><text x="176" y="336">0</text><text x="214" y="336">4</text></g>
    <text x="40" y="392" font-size="14" fill="#5b665f">Total</text>
    <text x="280" y="392" font-size="18" font-weight="700" text-anchor="end">40 h</text>
    <rect x="40" y="416" width="240" height="48" rx="10" fill="#1f6f54"/>
    <text x="160" y="446" font-size="16" font-weight="600" fill="#fff" text-anchor="middle">Submit for approval</text>
    <rect x="40" y="476" width="240" height="40" rx="10" fill="none" stroke="#e3e1d9"/>
    <text x="160" y="501" font-size="14" text-anchor="middle" fill="#5b665f">Add expense</text>
  </g>
</svg>
