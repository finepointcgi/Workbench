<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d">
  <title id="t">Contract funding and invoice status</title>
  <desc id="d">Illustration of a contract page showing funded amount, billed amount, a funding bar and recent invoices.</desc>
  <rect width="960" height="360" rx="14" fill="#ffffff" stroke="#e3e1d9"/>
  <g font-family="system-ui,sans-serif" fill="#1c2420">
    <text x="32" y="52" font-size="22" font-weight="700">Task order 0042</text>
    <text x="32" y="76" font-size="14" fill="#5b665f">Cost-plus-fixed-fee · Period of performance to 30 Sep</text>
    <g>
      <rect x="32" y="102" width="280" height="86" rx="12" fill="#e4f1ea"/>
      <text x="52" y="132" font-size="13" fill="#5b665f">Funded</text><text x="52" y="168" font-size="28" font-weight="700">$1,200,000</text>
      <rect x="340" y="102" width="280" height="86" rx="12" fill="#f3f1ea"/>
      <text x="360" y="132" font-size="13" fill="#5b665f">Billed to date</text><text x="360" y="168" font-size="28" font-weight="700">$742,300</text>
      <rect x="648" y="102" width="280" height="86" rx="12" fill="#f6efe0"/>
      <text x="668" y="132" font-size="13" fill="#5b665f">Funding left</text><text x="668" y="168" font-size="28" font-weight="700">$457,700</text>
    </g>
    <rect x="32" y="212" width="896" height="14" rx="7" fill="#e3e1d9"/>
    <rect x="32" y="212" width="554" height="14" rx="7" fill="#1f6f54"/>
    <text x="32" y="250" font-size="13" fill="#5b665f">62% of funding used · alert at 85%</text>
    <g font-size="14">
      <line x1="32" y1="270" x2="928" y2="270" stroke="#e3e1d9"/>
      <text x="32" y="298">Invoice 0007</text><text x="400" y="298" fill="#5b665f">September</text><text x="928" y="298" text-anchor="end">$118,400 · Paid</text>
      <text x="32" y="330">Invoice 0008</text><text x="400" y="330" fill="#5b665f">October</text><text x="928" y="330" text-anchor="end">$124,900 · Submitted</text>
    </g>
  </g>
</svg>
